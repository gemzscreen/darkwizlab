<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | DarkWiz Lab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E6E9E4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317202A'/%3E%3Cpath d='M18 22 H46 L32 42 Z' fill='none' stroke='%23F5F6F2' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M10 46 H54' stroke='%236F9BEA' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--page:#E6E9E4;--sheet:#F5F6F2;--ink:#17202A;--graphite:#56606A;--rule:rgba(23,32,42,.16);--rule-hi:rgba(23,32,42,.34);--blue:#1F4FA8;--red:#B8372A}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--page);color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif;line-height:1.6;
  background-image:linear-gradient(rgba(31,79,168,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,79,168,.07) 1px,transparent 1px);
  background-size:40px 40px}
.sheet{max-width:560px;width:100%;background:var(--sheet);border:1px solid var(--rule-hi);padding:36px 32px 0;position:relative}
.sheet::before{content:'';position:absolute;inset:8px;border:1px solid var(--rule);pointer-events:none}
svg{display:block;width:100%;height:auto;margin-bottom:18px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(34px,7vw,48px);line-height:1.04}
p{color:var(--graphite);font-size:17px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 26px}
a.btn{display:inline-flex;padding:12px 18px;border-radius:4px;font-weight:600;text-decoration:none;border:1.5px solid var(--rule-hi);color:var(--ink)}
a.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.tb{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule-hi);margin:0 -32px}
.tb div{padding:8px 14px;border-left:1px solid var(--rule);font-size:13px;color:var(--graphite)}
.tb div:first-child{border-left:0}
.tb b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;color:var(--ink);font-weight:600}
</style>
</head>
<body>
  <main class="sheet">
    <svg viewBox="0 0 480 120" aria-hidden="true">
      <rect x="40" y="46" width="200" height="12" fill="none" stroke="#17202A" stroke-width="2"/>
      <path d="M50 58 L38 78 H62 Z" fill="none" stroke="#17202A" stroke-width="1.8"/>
      <line x1="30" y1="78" x2="70" y2="78" stroke="#17202A"/>
      <path d="M240 46 L262 40 L248 52 L270 50" fill="none" stroke="#B8372A" stroke-width="2"/>
      <rect x="290" y="58" width="150" height="12" fill="none" stroke="#17202A" stroke-width="2" transform="rotate(14 290 58)"/>
      <line x1="300" y1="112" x2="460" y2="112" stroke="#17202A"/>
      <text x="40" y="24" font-family="Barlow, sans-serif" font-size="15" fill="#B8372A">Member not found</text>
    </svg>
    <h1>This page isn't in the drawing set.</h1>
    <p>The address you followed doesn't exist on darkwizlab.com. Check the spelling, or go back to the register.</p>
    <div class="row">
      <a class="btn pri" href="https://darkwizlab.com/#register">Back to the register</a>
      <a class="btn" href="https://darkwizlab.com/">Home</a>
    </div>
    <div class="tb"><div>Error<b>404</b></div><div>Sheet<b>Not issued</b></div><div>Project<b>DarkWiz Lab</b></div></div>
  </main>
</body>
</html>

<style>

  --line:rgba(140,160,255,.14); --line-hi:rgba(140,160,255,.30);

*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; display:grid; place-items:center; padding:32px;

.code{
  font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--muted-2);
}
h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,7vw,46px); line-height:1.1; letter-spacing:-.03em}
p{color:var(--muted); font-size:15.5px}
.row{display:flex; flex-wrap:wrap; gap:11px; justify-content:center; margin-top:6px}
a.btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 20px; border-radius:12px;
  font-weight:600; font-size:14.5px; text-decoration:none; color:inherit;
  border:1px solid transparent; transition:transform .16s;
}
a.btn:hover{transform:translateY(-2px)}
a.pri{background:var(--grad); color:#fff}
a.gho{border-color:var(--line-hi); background:var(--field)}
